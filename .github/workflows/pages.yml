# Daily refresh -> JSON snapshot -> static site on GitHub Pages. No server needed.
# Also runs on push, on manual dispatch, and when the project is opened in VS Code
# (.vscode/tasks.json runs `gh workflow run` on folder open).
# The SQLite database is carried between runs in the Actions cache, so insight
# hysteresis and forecast history persist; if the cache is evicted, the next run
# simply backfills from scratch (about a minute).
name: Refresh and deploy

on:
  schedule:
    - cron: "17 11 * * *"  # daily, 11:17 UTC (6:17 AM ET in winter)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      - name: Tests
        working-directory: backend
        run: python -m pytest -q

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: Refresh data
        working-directory: backend
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          EMBER_API_KEY: ${{ secrets.EMBER_API_KEY }}
        run: |
          python -m app.scheduler --once
          python -c "import sqlite3; sqlite3.connect('../data/energysignal.db').execute('PRAGMA wal_checkpoint(TRUNCATE)')"

      - name: Save database
        uses: actions/cache/save@v4
        with:
          path: data
          key: db-${{ github.run_id }}

      - name: Export JSON snapshot
        working-directory: backend
        run: python -m app.export_static ../frontend/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build static site
        working-directory: frontend
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npx next build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
